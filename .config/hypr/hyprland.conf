# Monitor
monitor = , preferred, auto, 1

# Exec
exec-once = dbus-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprctl setcursor Catppuccin-mocha-dark-cursors 24
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = sh /home/sumit/.config/hypr/scripts/launch.sh
exec-once = sh /home/sumit/.config/hypr/scripts/slideshow.sh -m eDP-1
exec-once = udiskie &

# Startup Apps
exec-once = waybar
exec-once = wezterm
exec-once = firefox
exec-once = discord

# Input
input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    disable_while_typing = no
  }
}

# General
general {
  gaps_in = 2
  gaps_out = 2
  col.active_border = rgba(ffffffff)
  col.inactive_border = rgba(545879aa)
  no_border_on_floating = false
}

# Misc
misc {
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  swallow_regex = ^(wezterm)$
}

# Decoration
decoration {
  rounding = 8
  blur {
    size = 1
    new_optimizations = true
  }
}

# Group
group {
  groupbar {
    gradients = false
    col.active = rgba(ffffffff)
    col.inactive = rgba(545879aa)
    text_color = rgba(ffffffff)
  }
  col.border_active = rgba(ffffffff)
  col.border_inactive = rgba(545879aa)
}

# Animations
animations {
  # Bezier Curve
  bezier = overshot, 0.05, 0.9, 0.1, 1.05
  bezier = smoothOut, 0.36, 0, 0.66, -0.56
  bezier = smoothIn, 0.25, 1, 0.5, 1

  animation = windows, 1, 10, overshot, slide
  animation = windowsOut, 1, 9, smoothOut, slide
  animation = windowsMove, 1, 9, default
  animation = border, 1, 10, default
  animation = fade, 1, 10, smoothIn
  animation = workspaces, 1, 6, default
}

# Layouts
dwindle {
  force_split = 2
  preserve_split = true # you probably want this
}

# Window Rules

# Workspace Assignments
windowrulev2 = workspace 2 silent, class:^(firefox)$
windowrulev2 = workspace 3 silent, class:^(discord)$
windowrulev2 = workspace 4 silent, class:^(Spotify)$

# Floating Rules (General Dialogs)
windowrule = float, title:file_progress
windowrule = float, title:confirm
windowrule = float, title:dialog
windowrule = float, title:download
windowrule = float, title:notification
windowrule = float, title:error
windowrule = float, title:splash
windowrule = float, title:confirmreset
windowrule = float, title:Open File
windowrule = float, title:Open Document
windowrule = float, title:Open Folder
windowrule = float, title:branchdialog

# Floating Rules (Specific Apps)
windowrulev2 = float, class:^(org.wezfurlong.wezterm)$
windowrulev2 = float, class:^(Spotify)$
windowrulev2 = float, class:^(org.gnome.Nautilus)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(zoom)$
windowrulev2 = float, class:^(gnome-calculator)$
windowrulev2 = float, class:^(flameshot)$
windowrule = float, title:pavucontrol-qt
windowrule = float, title:pavucontrol
windowrule = float, title:^(Media Viewer)$
windowrule = float, title:^(Volume Control)$
windowrule = float, title:^(Picture-in-Picture)$

# Rofi
windowrule = float, title:^(rofi)$

# Firefox
windowrule = idleinhibit fullscreen, class:firefox
windowrulev2 = float, class:^(firefox)$, title:^(Enter name of file to save to…)$
windowrulev2 = float, class:^(firefox)$, title:^(Save Image)$
windowrulev2 = float, class:^(firefox)$, title:^(Removing Cookies and Site Data)$
windowrulev2 = float, class:^(firefox)$, title:^(Save As)$
windowrulev2 = float, class:^(firefox)$, title:^(File Upload)$
windowrule = float, title:^(Firefox — Sharing Indicator)$
windowrule = move 0 0, title:^(Firefox — Sharing Indicator)$

# Discord
windowrulev2 = float, class:^(discord)$, title:^(Discord Updater)$

# Other
windowrulev2 = float, class:^(tilix)$, title:^(Tilix Preferences)$
windowrule = opacity 1, title:neovim

# KeyBind
bind = SUPER, Return, exec, wezterm
bind = SUPER, F, exec, firefox
bind = SUPER SHIFT, F, exec, firefox --private-window
bind = SUPER, B, exec, brave
bind = SUPER, D, exec, discord
bind = SUPER, W, exec, nautilus
bind = SUPER, E, exec, evince
bind = SUPER, Space, exec, pkill rofi || rofi -show drun --insensitive --allow-images
bind = SUPER SHIFT, Return, fullscreen
bind = SUPER, X, exec, hyprpicker -a -n

# Media Keys
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl -q set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%-

# Lock/Unlock KeyBinds
bind = SUPER, L, submap, clean
submap = clean
bind = SUPER, U, submap, reset
submap = reset

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, grim $HOME/Pictures/Screenshots/$(date +"%s.png")

# Window Management
bind = SUPER, Q, killactive
bind = SUPER SHIFT, Q, exit
bind = SUPER SHIFT, Space, togglefloating
bind = SUPER, P, pseudo
bind = SUPER, S, togglesplit

# Focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Movement
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Resize
bind = SUPER CTRL, left, resizeactive, -20 0
bind = SUPER CTRL, right, resizeactive, 20 0
bind = SUPER CTRL, up, resizeactive, 0 -20
bind = SUPER CTRL, down, resizeactive, 0 20

# Tabbed (Groups)
bind = SUPER, G, togglegroup
bind = SUPER, TAB, changegroupactive

# Special
bind = SUPER, C, movetoworkspace, special
bind = SUPER, Z, togglespecialworkspace

# Switch Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER ALT, up, workspace, e+1
bind = SUPER ALT, down, workspace, e-1

# Move Window to Workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Mouse Binding
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = SUPER, mouse_down, workspace e+1
bindm = SUPER, mouse_up, workspace e-1
