# Monitor
monitor = , preferred, auto, 1

# Exec
exec-once = dbus-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment wayland_display xdg_current_desktop
exec-once = hyprpolkitagent
exec-once = hyprpaper
exec-once = hypridle
exec-once = udiskie &
exec-once = sh /home/sumit/.config/hypr/scripts/launch.sh
exec-once = sh /home/sumit/.config/hypr/scripts/pet.sh

# Startup Apps
exec-once = waybar
exec-once = wezterm
exec-once = brave
exec-once = discord

# Input
input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
		natural_scroll = yes
    disable_while_typing = yes
		tap-to-click = yes
  }
}

# General
general {
	border_size = 2
  gaps_in = 0
  gaps_out = 0
	col.active_border = rgba(89dcebee) rgba(9F83C3ee) 225deg
  col.inactive_border = rgba(585b70aa)
}

# Misc
misc {
	force_default_wallpaper = 0
	disable_hyprland_logo = true
	disable_splash_rendering = true
	swallow_regex = ^(wezterm)$
	vfr = true
}

# Decoration
decoration {
  rounding = 0
	active_opacity = 0.85
	inactive_opacity = 0.7

  blur {
		enabled = true
    size = 4
		passes = 2
    new_optimizations = true
		vibrancy = 0.1696
  }

	shadow {
		enabled = true
		range = 4
		render_power = 3
		color = rgba(1a1a1aee)
	}
}

# Group
group {
  col.border_active = rgba(89dcebee) rgba(9f83c3ee) 45deg
  col.border_inactive = rgba(585b70aa)

  groupbar {
		enabled = true
		font_family = "JetBrainsMono Nerd Font"
		font_size = 10
		height = 10
		stacked = false
    gradients = false
		render_titles = true

    col.active = rgba(89dcebaa)
    col.inactive = rgba(313244aa)
		text_color = rgba(cdd6f4ff)
	}
}

animations {
	enabled = true

	bezier = fluent_decel, 0.1, 1, 0.3, 1
	bezier = easeOutExpo, 0.16, 1, 0.3, 1
	bezier = overshot, 0.05, 0.9, 0.1, 1.05

	animation = windows, 1, 3, fluent_decel, popin 60%
	animation = windowsIn, 1, 3, fluent_decel, popin 60%
	animation = windowsOut, 1, 3, fluent_decel, popin 80%
	animation = windowsMove, 1, 3, fluent_decel, slide

	animation = workspaces, 1, 4, easeOutExpo, slidefade 20%
	animation = specialWorkspace, 1, 3, fluent_decel, slidevert

	animation = border, 1, 5, default
	animation = fade, 1, 3, default
}

# Layouts
dwindle {
	pseudotile = true
	preserve_split = true # you probably want this
  force_split = 2
}

# Window Rules

# Workspace Assignments
windowrule = workspace 2 silent, match:class ^(firefox)$
windowrule = workspace 3 silent, match:class ^(discord)$
windowrule = workspace 4 silent, float on, match:class ^(Spotify)$

# Floating Rules (General Dialogs)
windowrule = float on, match:title file_progress
windowrule = float on, match:title confirm
windowrule = float on, match:title dialog
windowrule = float on, match:title download
windowrule = float on, match:title notification
windowrule = float on, match:title error
windowrule = float on, match:title splash
windowrule = float on, match:title confirmreset
windowrule = float on, match:title Open File
windowrule = float on, match:title Open Document
windowrule = float on, match:title Open Folder
windowrule = float on, match:title branchdialog

# Floating Rules (Specific Apps)
windowrule = float on, match:class ^(org.wezfurlong.wezterm)$
windowrule = float on, match:class ^(org.gnome.Nautilus)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(zoom)$
windowrule = float on, match:class ^(gnome-calculator)$
windowrule = float on, match:class ^(flameshot)$
windowrule = float on, match:title pavucontrol-qt
windowrule = float on, match:title pavucontrol
windowrule = float on, match:title ^(Media Viewer)$
windowrule = float on, match:title ^(Volume Control)$
windowrule = float on, match:title ^(Picture-in-Picture)$

# Rofi
windowrule = float on, match:title ^(rofi)$

# pet
windowrule = border_size 0, no_shadow on, no_blur on, pin on, match:title ^(qtpet)$
windowrule = opacity 1.0 override, match:title ^(qtpet)$

# Firefox
windowrule = idle_inhibit fullscreen, match:class firefox
windowrule = float on, match:class ^(firefox)$, match:title ^(Enter name of file to save to…)$
windowrule = float on, match:class ^(firefox)$, match:title ^(Save Image)$
windowrule = float on, match:class ^(firefox)$, match:title ^(Removing Cookies and Site Data)$
windowrule = float on, match:class ^(firefox)$, match:title ^(Save As)$
windowrule = float on, match:class ^(firefox)$, match:title ^(File Upload)$
windowrule = float on, move (00), match:title ^(Firefox — Sharing Indicator)$

# Discord
windowrule = float on, match:class ^(discord)$, match:title ^(Discord Updater)$

# Other
windowrule = float on, match:class ^(tilix)$, match:title ^(Tilix Preferences)$
windowrule = opacity 1, match:title neovim

# KeyBind
bind = SUPER, Return, exec, wezterm
bind = SUPER, F, exec, brave
bind = SUPER SHIFT, F, exec, brave --incognito
bind = SUPER, B, exec, brave
bind = SUPER, D, exec, discord
bind = SUPER, W, exec, nautilus
bind = SUPER, E, exec, evince
bind = SUPER, Space, exec, pkill rofi || rofi -show drun --insensitive --allow-images
bind = SUPER SHIFT, Return, fullscreen
bind = SUPER, X, exec, hyprpicker -a -n
bind = SUPER, delete, exec, loginctl lock-session

# Media Keys
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl -q set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%-

# Lock/Unlock KeyBinds
bind = SUPER, L, submap, clean
submap = clean
bind = SUPER, U, submap, reset
submap = reset

# Screenshot
bind = , Print, exec, hyprshot -m region
bind = SHIFT, Print, exec, hyprshot -m window
bind = CTRL, Print, exec, hyprshot -m output

# Window Management
bind = SUPER, Q, killactive
bind = SUPER SHIFT, Q, exit
bind = SUPER SHIFT, Space, togglefloating
# bind = SUPER, P, pseudo
bind = SUPER, P, pin

# Focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Movement
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Resize
bind = SUPER CTRL, left, resizeactive, -20 0
bind = SUPER CTRL, right, resizeactive, 20 0
bind = SUPER CTRL, up, resizeactive, 0 -20
bind = SUPER CTRL, down, resizeactive, 0 20

# Tabbed (Groups)
bind = SUPER, G, togglegroup
bind = SUPER, TAB, changegroupactive

# Special
bind = SUPER, C, movetoworkspace, special
bind = SUPER, Z, togglespecialworkspace

# Switch Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER ALT, up, workspace, e+1
bind = SUPER ALT, down, workspace, e-1

# Move Window to Workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Mouse Binding
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = SUPER, mouse_down, workspace e+1
bindm = SUPER, mouse_up, workspace e-1
